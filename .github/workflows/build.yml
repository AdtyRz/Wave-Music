name: windows

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build portable ZIP
        run: .\gradlew.bat :desktop:packagePortableZip

      - uses: actions/upload-artifact@v4
        with:
          name: wvusic-windows
          path: desktop/build/compose/binaries/main/app/Wvusic-*-portable.zip
